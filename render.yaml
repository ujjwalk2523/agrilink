services:
  - type: web
    name: agrilink-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push --accept-data-loss && node prisma/seed.mjs && npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: agrilink-db
          property: connectionString

databases:
  - name: agrilink-db
    plan: free
    databaseName: agrilink
    user: agrilink_user
